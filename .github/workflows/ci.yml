name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate source and package
        run: |
          python scripts/validate_skills.py --source
          python scripts/validate_skills.py --package
      - name: Run regression tests
        run: |
          python scripts/test_validate_skills.py
          python scripts/test_assemble_plugin.py
      - name: Check assembly without writing
        run: python scripts/assemble_plugin.py --check
